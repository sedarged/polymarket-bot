# HorizontalPodAutoscaler for Polymarket Bot
# NOTE: For trading bots, horizontal scaling is typically NOT recommended
# as it can lead to duplicate orders and race conditions.
# This is provided for reference only. Use with extreme caution.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: polymarket-bot
  namespace: polymarket-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: polymarket-bot
  minReplicas: 1
  maxReplicas: 1  # Keep at 1 for trading bot to avoid duplicate orders
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
