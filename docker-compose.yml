# Docker Compose configuration for Polymarket Trading Bot
# Supports local development and testing
# Addresses PR-015: Docker local/development deployment

services:
  # Backend service - Polymarket Trading Bot API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: polymarket-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      # API Configuration
      - GAMMA_API_URL=${GAMMA_API_URL:-https://gamma-api.polymarket.com}
      - CLOB_API_URL=${CLOB_API_URL:-https://clob.polymarket.com}
      - WS_MARKET_URL=${WS_MARKET_URL:-wss://ws-subscriptions-clob.polymarket.com/ws/market}
      
      # Market Configuration
      - TOKEN_IDS=${TOKEN_IDS:-}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Trading Gates (default to paper mode for safety)
      - LIVE_TRADING=${LIVE_TRADING:-false}
      - COMPLIANCE_ACCEPTED=${COMPLIANCE_ACCEPTED:-false}
      
      # Secret Management (NEVER put actual secrets here - use .env file)
      - SECRET_SOURCE=${SECRET_SOURCE:-env}
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      
      # Authentication
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      
      # Blockchain
      - CHAIN_ID=${CHAIN_ID:-137}
      
      # Server (API on 3000; metrics on 9090 per Research §7 Day 6)
      - PORT=3000
      - METRICS_PORT=9090
      
      # Retry Configuration
      - RETRY_ATTEMPTS=${RETRY_ATTEMPTS:-3}
      - RETRY_DELAY=${RETRY_DELAY:-1000}
      - RETRY_TOTAL_TIMEOUT=${RETRY_TOTAL_TIMEOUT:-300000}
      
      # Paper Trading
      - PAPER_TRADING_SLIPPAGE=${PAPER_TRADING_SLIPPAGE:-0.01}
      - PAPER_TRADING_MAX_SLIPPAGE=${PAPER_TRADING_MAX_SLIPPAGE:-0.05}
      - PAPER_TRADING_FEE_RATE=${PAPER_TRADING_FEE_RATE:-0.002}
      - PAPER_TRADING_PARTIAL_FILL_RATE=${PAPER_TRADING_PARTIAL_FILL_RATE:-0.0}
      - PAPER_TRADING_MIN_FILL_RATIO=${PAPER_TRADING_MIN_FILL_RATIO:-0.1}
      - PAPER_TRADING_MAX_FILL_RATIO=${PAPER_TRADING_MAX_FILL_RATIO:-0.9}
      
      # Risk Management
      - RISK_MAX_EXPOSURE_PER_MARKET=${RISK_MAX_EXPOSURE_PER_MARKET:-1000}
      - RISK_MAX_OPEN_ORDERS=${RISK_MAX_OPEN_ORDERS:-50}
      - RISK_MAX_DRAWDOWN=${RISK_MAX_DRAWDOWN:-0.20}
      - RISK_ERROR_RATE_THRESHOLD=${RISK_ERROR_RATE_THRESHOLD:-0.10}
      - RISK_ERROR_RATE_WINDOW=${RISK_ERROR_RATE_WINDOW:-100}
      
      # Circuit Breaker
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - CIRCUIT_BREAKER_RESET_TIMEOUT_MS=${CIRCUIT_BREAKER_RESET_TIMEOUT_MS:-60000}
      - CIRCUIT_BREAKER_SUCCESS_THRESHOLD=${CIRCUIT_BREAKER_SUCCESS_THRESHOLD:-2}
      
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      
      # Reconciliation
      - RECONCILIATION_INTERVAL_SECONDS=${RECONCILIATION_INTERVAL_SECONDS:-300}
      
      # Rate Limiting
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_TRUST_PROXY=${RATE_LIMIT_TRUST_PROXY:-false}
      
      # Alerting
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_ERROR_RATE_THRESHOLD=${ALERT_ERROR_RATE_THRESHOLD:-5}
      - ALERT_CIRCUIT_BREAKER_TRIPS=${ALERT_CIRCUIT_BREAKER_TRIPS:-1}
      
      # Learning System Database Paths
      - EVENT_STORE_PATH=${EVENT_STORE_PATH:-./data/events.db}
      - SIGNAL_CATALOG_PATH=${SIGNAL_CATALOG_PATH:-./data/signals.db}
      - BACKTEST_ENGINE_PATH=${BACKTEST_ENGINE_PATH:-./data/backtests.db}
      - PROMOTION_WORKFLOW_PATH=${PROMOTION_WORKFLOW_PATH:-./data/promotions.db}
    
    volumes:
      # Mount data directory for persistent state
      - ./data:/app/data
      # Mount source code for development (comment out for production)
      # - ./apps/backend/src:/app/apps/backend/src
      # - ./packages/shared/src:/app/packages/shared/src
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - polymarket-network
    
    # Optional: Override command for different modes
    # command: npm run markets  # For market fetching
    # command: npm run book     # For orderbook display

  # Frontend service - Trading Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: polymarket-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Frontend connects to backend API
      - BACKEND_URL=http://backend:3000
    
    volumes:
      # Mount public directory for development
      # - ./apps/frontend/public:/app/apps/frontend/public
      - frontend-static:/app/apps/frontend/public
    
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    depends_on:
      backend:
        condition: service_healthy
    
    networks:
      - polymarket-network
    
    command: npm run --workspace @polymarket/frontend start

  # Prometheus for metrics (Research §7 Day 6). Enable for out-of-box observability.
  # Mapped to 9092 on host so backend metrics can use 9090 (Research §9.1).
  prometheus:
    image: prom/prometheus:latest
    container_name: polymarket-prometheus
    restart: unless-stopped
    ports:
      - "9092:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - polymarket-network

  # Grafana for dashboards (Research §7 Day 6). Import grafana/polymarket-dashboard.json.
  grafana:
    image: grafana/grafana:latest
    container_name: polymarket-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - polymarket-network

networks:
  polymarket-network:
    driver: bridge

volumes:
  frontend-static:
  prometheus-data:
  grafana-data:
