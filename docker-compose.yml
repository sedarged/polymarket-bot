services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://backend:${BACKEND_PORT:-3000}
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://backend:${BACKEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - internal
      - frontend

networks:
  internal:
    internal: true
  frontend:
    driver: bridge
