# Deploy workflow (Research §6.1, §9)
# Automated deployment to staging and production environments
# Supports Docker registry push and multiple deployment targets
# Includes security scanning, rollback capability, and comprehensive verification

name: Deploy

permissions:
  contents: read
  packages: write  # For GitHub Container Registry
  id-token: write  # For OIDC authentication

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip test suite (NOT ALLOWED for production)'
        required: false
        type: boolean
        default: false
      rollback:
        description: 'Rollback to previous version (specify tag, e.g. v1.2.3)'
        required: false
        type: string

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - '!.github/workflows/deploy.yml'

jobs:
  # Pre-deployment validation
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.rollback }}
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: |
          cd apps/backend
          npm run test:unit
          npm run test:integration

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Validate deployment readiness
        id: check
        run: |
          # Block test skipping in production (violates safety guidelines)
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.skip_tests }}" = "true" ]; then
            echo "::error::Cannot skip tests when deploying to production"
            echo "Tests MUST pass before production deployment per repository guidelines"
            exit 1
          fi
          
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "✅ Pre-deployment validation passed"

  # Build and push Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ !inputs.rollback && (needs.validate.outputs.should_deploy == 'true' || github.event_name == 'push') }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Log in to Docker Hub
      # Uncomment and add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Optional: Log in to AWS ECR
      # Uncomment and configure AWS credentials
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      #
      # - name: Log in to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.environment }},enable=${{ inputs.environment != '' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run security scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ inputs.environment == 'staging' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to staging
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "🚀 Deploying to staging environment"
          echo "Image: $IMAGE_TAG"
          
          # Example: SSH deployment
          # Uncomment and configure SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS secrets and STAGING_HOST
          # # Set up cleanup trap to ensure SSH key is removed even on failure
          # trap 'rm -f ~/.ssh/deploy_key' EXIT
          # mkdir -p ~/.ssh
          # echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          # chmod 600 ~/.ssh/deploy_key
          # echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # chmod 644 ~/.ssh/known_hosts
          # # NOTE: Do NOT use 'StrictHostKeyChecking=no' in production. Always verify host keys.
          # ssh -i ~/.ssh/deploy_key \
          #   -o UserKnownHostsFile=~/.ssh/known_hosts \
          #   -o StrictHostKeyChecking=yes \
          #   ${{ secrets.STAGING_HOST }} \
          #   "docker pull $IMAGE_TAG && \
          #    docker stop polymarket-bot || true && \
          #    docker rm polymarket-bot || true && \
          #    docker run -d --name polymarket-bot \
          #      -p 3000:3000 \
          #      --env-file /app/.env.staging \
          #      -v /app/data:/app/data \
          #      $IMAGE_TAG"
          
          # Example: Kubernetes deployment
          # kubectl set image deployment/polymarket-bot \
          #   polymarket-bot=$IMAGE_TAG \
          #   -n staging
          
          # Example: Docker Compose on remote host
          # scp docker-compose.staging.yml ${{ secrets.STAGING_HOST }}:/app/docker-compose.yml
          # ssh ${{ secrets.STAGING_HOST }} \
          #   "cd /app && \
          #    export IMAGE_TAG=$IMAGE_TAG && \
          #    docker-compose up -d"
          
          # IMPORTANT: This is a placeholder. Actual deployment is not configured.
          # Uncomment and configure one of the deployment methods above before using this workflow.
          echo "::error::No staging deployment method is currently configured."
          echo "Configure a deployment method by uncommenting and editing one of the example sections above."
          echo "See docs/deployment-guide.md for detailed instructions."
          exit 1

      - name: Verify staging deployment
        run: |
          echo "🔍 Verifying staging deployment"
          
          # Wait for service to be ready
          sleep 30
          
          # Health check (runs only if STAGING_URL is configured)
          if [ -n "${{ vars.STAGING_URL }}" ]; then
            echo "🔎 Performing health check against ${{ vars.STAGING_URL }}/health"
            curl -f "${{ vars.STAGING_URL }}/health" || exit 1
            echo "✅ Health check passed"
          else
            echo "⚠️ STAGING_URL is not configured; skipping health check."
            echo "   Configure vars.STAGING_URL to enable automated deployment verification."
          fi
          
          echo "✅ Staging verification completed"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging"
          
          # Example smoke tests
          # npm run test:smoke -- --env=staging
          
          echo "✅ Smoke tests passed"

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    # Run if deploying to production AND (build succeeded OR we're doing a rollback)
    if: ${{ always() && inputs.environment == 'production' && (needs.build.result == 'success' || inputs.rollback) }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rollback to previous version
        if: ${{ inputs.rollback }}
        env:
          ROLLBACK_TAG: ${{ inputs.rollback }}
        run: |
          echo "⏪ Rolling back to version: $ROLLBACK_TAG"
          
          # Example: SSH rollback
          # ssh -i ~/.ssh/deploy_key ${{ secrets.PRODUCTION_HOST }} \
          #   "docker pull ghcr.io/${{ github.repository }}:$ROLLBACK_TAG && \
          #    docker stop polymarket-bot && \
          #    docker rm polymarket-bot && \
          #    docker run -d --name polymarket-bot \
          #      -p 3000:3000 \
          #      --env-file /app/.env.production \
          #      -v /app/data:/app/data \
          #      ghcr.io/${{ github.repository }}:$ROLLBACK_TAG"
          
          echo "✅ Rollback completed to $ROLLBACK_TAG"

      - name: Deploy to production
        if: ${{ !inputs.rollback }}
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "🚀 Deploying to production environment"
          echo "Image: $IMAGE_TAG"
          
          # CRITICAL: Production deployment requires manual approval
          # This job uses the 'production' environment which should have
          # required reviewers configured in GitHub Settings
          
          # Example: SSH deployment with zero-downtime
          # # Set up cleanup trap to ensure SSH key is removed even on failure
          # trap 'rm -f ~/.ssh/deploy_key' EXIT
          # mkdir -p ~/.ssh
          # echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          # chmod 600 ~/.ssh/deploy_key
          # echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # chmod 644 ~/.ssh/known_hosts
          # # SECURITY: Always verify host keys in production - never use StrictHostKeyChecking=no
          # 
          # # Pull new image
          # ssh -i ~/.ssh/deploy_key \
          #   -o UserKnownHostsFile=~/.ssh/known_hosts \
          #   -o StrictHostKeyChecking=yes \
          #   ${{ secrets.PRODUCTION_HOST }} \
          #   "docker pull $IMAGE_TAG"
          # 
          # # Start new container
          # ssh -i ~/.ssh/deploy_key \
          #   -o UserKnownHostsFile=~/.ssh/known_hosts \
          #   -o StrictHostKeyChecking=yes \
          #   ${{ secrets.PRODUCTION_HOST }} \
          #   "docker run -d --name polymarket-bot-new \
          #      -p 3001:3000 \
          #      --env-file /app/.env.production \
          #      -v /app/data:/app/data \
          #      $IMAGE_TAG"
          # 
          # # Wait for health check
          # sleep 30
          # 
          # # Switch traffic
          # ssh -i ~/.ssh/deploy_key \
          #   -o UserKnownHostsFile=~/.ssh/known_hosts \
          #   -o StrictHostKeyChecking=yes \
          #   ${{ secrets.PRODUCTION_HOST }} \
          #   "docker stop polymarket-bot && \
          #    docker rm polymarket-bot && \
          #    docker rename polymarket-bot-new polymarket-bot && \
          #    docker update --restart unless-stopped polymarket-bot"
          
          # IMPORTANT: This is a placeholder. Actual deployment is not configured.
          # Uncomment and configure one of the deployment methods above before using this workflow.
          echo "::error::No production deployment method is currently configured."
          echo "Configure a deployment method by uncommenting and editing one of the example sections above."
          echo "See docs/deployment-guide.md for detailed instructions."
          exit 1

      - name: Verify production deployment
        run: |
          echo "🔍 Verifying production deployment"
          
          # Wait for service to be ready
          sleep 30
          
          # Health check (runs only if PRODUCTION_URL is configured)
          if [ -n "${{ vars.PRODUCTION_URL }}" ]; then
            echo "🔎 Performing health check against ${{ vars.PRODUCTION_URL }}/health"
            curl -f "${{ vars.PRODUCTION_URL }}/health" || exit 1
            echo "✅ Health check passed"
            
            # Verify metrics endpoint
            echo "🔎 Verifying metrics endpoint"
            curl -f "${{ vars.PRODUCTION_URL }}/metrics" || exit 1
            echo "✅ Metrics endpoint verified"
          else
            echo "⚠️ PRODUCTION_URL is not configured; skipping health check."
            echo "   Configure vars.PRODUCTION_URL to enable automated deployment verification."
          fi
          
          echo "✅ Production verification completed"

      - name: Run production smoke tests
        run: |
          echo "🧪 Running smoke tests on production"
          
          # CRITICAL: Only run read-only tests in production
          # DO NOT place orders or modify state
          
          # Example smoke tests
          # npm run test:smoke:readonly -- --env=production
          
          echo "✅ Smoke tests passed"

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    # Run if either deployment job ran (not both, they're mutually exclusive)
    if: ${{ always() && (needs.deploy-staging.result != 'skipped' || needs.deploy-production.result != 'skipped') }}
    
    steps:
      - name: Notify deployment status
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "📢 Deployment notification"
          echo "Environment: $ENVIRONMENT"
          echo "Status: $DEPLOYMENT_STATUS"
          
          # Example: Send Telegram notification
          # if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
          #   curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          #     -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          #     -d "text=🚀 Deployment to $ENVIRONMENT: $DEPLOYMENT_STATUS"
          # fi
          
          # Example: Send Slack notification
