name: Test Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Vitest V8 coverage provider for backend
        run: npm install -w apps/backend --no-save @vitest/coverage-v8
      
      - name: Run tests with coverage
        run: npm run test:coverage
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/backend/coverage/coverage-final.json
          flags: unittests
          name: polymarket-bot
          fail_ci_if_error: false
