name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          stale-issue-message: |
            This issue has been inactive for 60 days and will close in 7 days.
            If still relevant, please comment to keep it open.
          close-issue-message: 'Closed due to inactivity. Feel free to reopen if still relevant.'
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'P0,P1,in-progress,security,blocked'
          
          stale-pr-message: 'This PR has been inactive for 21 days. Please update or close.'
          close-pr-message: 'Closing stale PR.'
          days-before-pr-stale: 21
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'in-progress,security,blocked'
